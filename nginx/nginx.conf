# ─────────────────────────────────────────────────────────────
# NextGen IT Hub — Hardened Production Nginx Configuration
# Compliant with OWASP ASVS Level 2, PCI-DSS & DPDP Act 2023
# ─────────────────────────────────────────────────────────────

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance & Network Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Privacy Compliance: IP Masking in Access Logs (DPDP Act 2023)
    # Masks the last octet of IPv4 and last segments of IPv6
    map $remote_addr $ip_masked {
        ~(?P<ip>\d+\.\d+\.\d+)\.\d+      $ip.0;
        ~(?P<ip>[^:]+:[^:]+):            $ip::;
        default                           0.0.0.0;
    }

    log_format masked_combined '$ip_masked - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent" '
                              'rt=$request_time ut=$upstream_response_time';

    access_log /var/log/nginx/access.log masked_combined buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Rate Limiting Zones (Token Bucket Defense against DDoS & Brute-Force)
    limit_req_zone $binary_remote_addr zone=general_api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream to Next.js Application Server
    upstream nextjs_upstream {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # Cloudflare IP Ranges definition for Admin Panel Restriction
    geo $is_cloudflare_or_admin {
        default 0;
        # Localhost & Internal Loopback
        127.0.0.1/32 1;
        ::1/128 1;
        10.0.0.0/8 1;
        172.16.0.0/12 1;
        192.168.0.0/16 1;
        # Cloudflare IPv4 Official Ranges
        173.245.48.0/20 1;
        103.21.244.0/22 1;
        103.22.200.0/22 1;
        103.31.4.0/22 1;
        141.101.64.0/18 1;
        108.162.192.0/18 1;
        190.93.240.0/20 1;
        188.114.96.0/20 1;
        197.234.240.0/22 1;
        198.41.128.0/17 1;
        162.158.0.0/15 1;
        104.16.0.0/13 1;
        104.24.0.0/14 1;
        172.64.0.0/13 1;
        131.0.72.0/22 1;
    }

    # 1. HTTP to HTTPS Redirection (Port 80 -> 443)
    server {
        listen 80;
        listen [::]:80;
        server_name nextgenithub.in www.nextgenithub.in;

        # Let's Encrypt ACME Challenge Directory
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Hardened HTTPS Server (Port 443)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name nextgenithub.in www.nextgenithub.in;

        # TLS Certificates (Let's Encrypt / Cloudflare Origin CA)
        ssl_certificate /etc/letsencrypt/live/nextgenithub.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nextgenithub.in/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/nextgenithub.in/chain.pem;

        # Modern TLS Security Protocols (Mozilla Modern Profile - SSL Labs A+)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:20m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # Hardened HTTP Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com wss://*.livekit.cloud; frame-src 'self' https://api.razorpay.com https://challenges.cloudflare.com https://www.google.com; object-src 'none'; base-uri 'self';" always;

        # Request Size Limits (Mitigate DoS / memory exhaustion)
        client_max_body_size 10M;
        client_body_buffer_size 128k;

        # Static Assets Caching (Next.js immutable static build assets)
        location /_next/static/ {
            proxy_pass http://nextjs_upstream;
            proxy_cache_valid 200 365d;
            expires 365d;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /static/ {
            alias /app/public/;
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000";
        }

        # RFC 9116 security.txt Endpoint
        location = /.well-known/security.txt {
            proxy_pass http://nextjs_upstream;
            add_header Content-Type "text/plain; charset=utf-8";
            access_log off;
        }

        # Admin Panel Access Control (Block access unless from Cloudflare or Admin VPN IPs)
        location /admin {
            if ($is_cloudflare_or_admin = 0) {
                return 403;
            }

            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/admin/ {
            if ($is_cloudflare_or_admin = 0) {
                return 403;
            }

            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth Endpoints Rate Limiting (Prevent Brute-Force & Credential Stuffing)
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Payment & Checkout Endpoints Rate Limiting
        location /api/payments/ {
            limit_req zone=payment_limit burst=5 nodelay;
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket Support (LiveKit / Real-time notifications)
        location /ws/ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # Default Application Proxy
        location / {
            limit_req zone=general_api burst=40 nodelay;
            limit_conn conn_limit 30;

            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
